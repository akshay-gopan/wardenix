name: Bug report
description: Something is broken or behaving incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report.
        Before submitting, please search existing issues to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably trigger the bug.
      placeholder: |
        1. Configure an upstream MCP server ...
        2. Send a tool call with ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste gateway logs, Python tracebacks, or browser console output.
      render: text

  - type: input
    id: version
    attributes:
      label: Wardenix version / commit
      placeholder: e.g. main@abc1234

  - type: dropdown
    id: transport
    attributes:
      label: Upstream transport
      options:
        - HTTP (streamable)
        - stdio bridge
        - Both / unsure
