name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wardenix
          POSTGRES_PASSWORD: wardenix_test_pw
          POSTGRES_DB: wardenix
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WARDENIX_JWT_SECRET: ci-only-insecure-secret
      WARDENIX_BOOTSTRAP_ADMIN_EMAIL: admin@wardenix.local
      WARDENIX_BOOTSTRAP_ADMIN_PASSWORD: changeme-admin
      POSTGRES_USER: wardenix
      POSTGRES_PASSWORD: wardenix_test_pw
      POSTGRES_DB: wardenix
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: |
          ruff check app bridge tests
          ruff format --check .

      - name: Run tests
        working-directory: backend
        run: pytest --tb=short -q

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check + build
        working-directory: frontend
        run: npm run build
